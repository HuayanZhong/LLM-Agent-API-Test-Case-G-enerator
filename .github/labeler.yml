apps/backend:
  - changed-files:
      - any-glob-to-any-file: "apps/backend/**"

apps/bff:
  - changed-files:
      - any-glob-to-any-file: "apps/bff/**"

packages:
  - changed-files:
      - any-glob-to-any-file: "packages/**"

