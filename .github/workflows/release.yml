name: Release

on:
  push:
    branches: [main]
    # 只有可能影响版本的改动才触发；纯文档 / OpenSpec 提交不会跑。
    paths:
      - ".changeset/**"
      - "package.json"
      - "apps/*/package.json"
      - "packages/*/package.json"
      - "scripts/sync-version.mjs"
      - "scripts/format-changelog.mjs"
      - ".github/workflows/release.yml"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Changesets 需要完整历史来计算版本变更。
          fetch-depth: 0
          persist-credentials: false
      - uses: $/.github/actions/setup
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-script: pnpm changeset:version
          commit-message: "chore(release): 版本号更新"
          pr-title: "chore(release): 版本号更新"
          # 私有包不发 npm、不打 tag、不创建 GitHub Release
          create-github-releases: false
          push-git-tags: false
        env:
          # changelog-github 生成 CHANGELOG 时要查 PR / 提交作者，需要 token
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
