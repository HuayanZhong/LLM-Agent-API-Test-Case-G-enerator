# workspace 包范围：apps/* 与 packages/*
packages:
  - apps/*
  - packages/*

# 版本不符时直接失败，而不是只发警告
engineStrict: true

# 依赖版本统一在这里管理；包内用 "pkg": "catalog:分类名" 引用
# pnpm 不接受空 catalog，未启用的分类保持注释，加入依赖时再启用
catalogs:
  # 工具链：Turbo、TypeScript、Vite、CLI 等
  tooling:
    "@fission-ai/openspec": ^2.0.0
    turbo: ^2.11.11
    oxlint: ^1.93.0
    oxfmt: ^0.78.0
    typescript: ^6.0.3
    "@types/node": ^26.6.6
    shadcn: ^4.23.0
    vite: ^8.3.8

  # 前端：Next.js、React、Tailwind、shadcn 组件依赖
  frontend:
    next: ^16.4.6
    react: ^19.3.1
    react-dom: ^19.3.1
    next-themes: ^0.4.6
    tailwindcss: ^4.3.5
    "@tailwindcss/postcss": ^4.3.5
    "@types/react": ^19.3.0
    "@types/react-dom": ^19.3.0
    lucide-react: ^1.72.0
    class-variance-authority: ^0.7.1
    cn: ^0.5.2
    radix-ui: ^1.8.1
    tw-animate-css: ^1.4.0

  # Storybook：组件预览、文档与 MCP AI 工具
  storybook:
    storybook: ^10.6.7
    "@storybook/react-vite": ^10.6.7
    "@storybook/addon-docs": ^10.6.7
    "@storybook/addon-a11y": ^10.6.7
    "@storybook/addon-themes": ^10.6.7
    "@storybook/addon-mcp": ^10.6.7

  # 后端：NestJS 服务（backend / bff）；LangGraph、Zod、MikroORM 等后续加入
  backend:
    "@nestjs/common": ^12.5.0
    "@nestjs/core": ^12.5.0
    "@nestjs/platform-express": ^12.5.0
    "@nestjs/testing": ^12.5.0
    "@nestjs/cli": ^12.0.12
    "@nestjs/schematics": ^12.0.13
    "@types/express": ^5.0.6
    reflect-metadata: ^0.2.2
    rxjs: ^7.8.2

  # 测试与质量：Vitest、覆盖率、Testing Library
  testing:
    vitest: ^5.1.0
    "@vitest/coverage-v8": ^5.1.0
    jsdom: ^31.0.1
    "@testing-library/react": ^16.3.3
    "@testing-library/dom": ^10.4.2
    "@testing-library/jest-dom": ^6.9.1
    "@vitejs/plugin-react": ^6.3.0

# pnpm 12：允许依赖运行安装脚本（Storybook/Vite 构建需要 esbuild）
allowBuilds:
  esbuild: true

# pnpm 供应链策略：新版本发布后至少等待 1 天才可安装，降低投毒风险。
# 显式写出官方默认值，避免不同 pnpm 版本默认值漂移。
minimumReleaseAge: 1440

# 上面的例外清单。Turbo 平台二进制与 OpenSpec 由安装时自动写入；
# Nest 三件套与 jsdom 为手动放行，升级时复核是否仍必要。
minimumReleaseAgeExclude:
  - "@turbo/darwin-64@2.11.11"
  - "@turbo/darwin-arm64@2.11.11"
  - "@turbo/linux-64@2.11.11"
  - "@turbo/linux-arm64@2.11.11"
  - "@turbo/windows-64@2.11.11"
  - "@turbo/windows-arm64@2.11.11"
  - turbo@2.11.11
  - "@fission-ai/openspec@2.0.0"
  - "@nestjs/common@12.5.0"
  - "@nestjs/core@12.5.0"
  - "@nestjs/platform-express@12.5.0"
  - jsdom@31.0.1
