schema: spec-driven

context: |
  语言：zh-CN
  所有 OpenSpec 产物必须用中文撰写；结构化标题与 SHALL/MUST 关键词保留英文。

  项目：基于大模型智能体的接口测试用例辅助生成系统（本科毕设）。
  目标：别人交付已做好的功能 / 组件后，AI 按接口生成用例与测试数据，Agent 执行测试，
  再与正常现场记忆 / GraphRAG / OKF 比对；不一致时重放复现并出测试报告，一致时沉淀知识。
  红线：系统只诊断与复验，不改代码；测试报告是唯一交付物；关键节点由人确认。

  当前状态：pnpm monorepo；apps/frontend 是 Next.js 16 + React 19 + Tailwind v4 前端
  （3000，src/，output: "export" 静态导出到 out/；当前 `/` 客户端跳转 `/login/`，
  `/login/` 与 `/register/` 为邮箱 + 密码 + 验证码的 UI 演示，使用 Toast 反馈，
  支持中英双语切换（语言偏好本地持久化，URL 不变，不启用 [locale] 路由），
  根 layout 挂全局点击火花特效（@workspace/ui/components/click-spark，颜色随主题令牌切换）
  与全局窗口标题栏（src/components/layout/app-titlebar：透明 WCO、无标题/图标，
  语言/主题入口位于系统按钮左侧；系统按钮符号色随主题同步），
  不接 Supabase / BFF / backend），apps/desktop 是 Electron 45 + Forge 8 桌面壳
  （开发态加载 3000，生产态 app:// 托管静态导出，Windows 下 WCO 透明标题栏保留系统按钮，
  窗口最小 800×600，Windows x64 ZIP），
  packages/ui 提供 shadcn radix-nova 组件、共享样式与 Storybook 10.6（6006）；
  packages/i18n 提供中英双语文案目录、语言配置与键集合校验（@workspace/i18n；
  源码包、无构建；只放 JSON 与纯 TS，不依赖 React/Next；所有用户可见文案以 zh-CN 为事实来源）；
  packages/types 提供跨应用只读类型契约（@workspace/types；纯类型、无运行时产物，
  消费方只用 import type；当前含 DesktopPlatform、TitleBarTheme 与 DesktopBridge；
  controller 入参 DTO 与主进程内部契约不上移）；
  packages/config 提供环境变量解析与校验（@workspace/config；运行时工具、无构建，
  各应用在自己的 src/config.ts 定义 schema 并调用 loadConfig，非法值启动即失败；
  .env 加载仍由根脚本负责）；
  packages/request 提供 HTTP 请求基础设施（@workspace/request；ky 2 实例工厂 + 浏览器 preset，
  源码包、无构建，baseURL 由调用方传入，包内不读环境变量，错误类型直接暴露 ky 2 原生类，
  不含业务接口封装）；
  packages/typescript-config 提供 base / nextjs / react-library / nestjs 四个共享 tsconfig profile，
  根 pnpm check-types 经 Turbo 并行执行；packages/vitest-config 提供 base / react 两个 Vitest profile，
  覆盖率 reporter 为 text / lcov / json-summary，根 pnpm test 经 Turbo 并行执行并卡 95% 行覆盖率；
  apps/backend 与 apps/bff 是 NestJS 12 + ESM 骨架，分别监听 BACKEND_PORT（默认 5000）
  与 BFF_PORT（默认 4000），只有 GET /health；业务模块尚未接入；
  根 pnpm build 经 Turbo 构建四个 app（desktop 先复制前端 out 到 renderer）；
  pnpm-workspace.yaml 设 nodeLinker: hoisted（Forge 8 要求）；
  lint / format 已接入 Oxlint / Oxfmt（根配置 + 十一个包脚本），根配置文件由 format:root 检查。
  前端全局组件按职责分 components/layout（Provider 与窗口 chrome）与 components/controls（切换控件）；
  认证私有组件分 _components/brand / forms / fields；packages/ui 组件保持 shadcn CLI 的平铺结构。
  设计文档在 doc/，OpenSpec 规格在 openspec/specs。

  环境变量：根 .env.example 是唯一声明入口，实际值放 .env / .env.development / .env.production；
  dev / test / test:watch 按 .env → .env.development 顺序加载，build 按 .env → .env.production 加载，
  再由 Turbo 启动任务；前端 NEXT_PUBLIC_* 的实际值放 apps/frontend/.env.development / .env.production，
  由 Next 原生加载；ELECTRON_RENDERER_URL 控制桌面壳开发态加载地址（默认 http://localhost:3000）；
  变量必须同时写进 turbo.json 对应任务的 env，
  否则 Turbo 默认 strict 模式不会传给任务；.env*、apps/frontend/.env* 与 .nvmrc 在 globalDependencies 中。

  CI：.github/workflows 按 quality / test / build / security / labeler / release 拆分，
  共用 .github/actions/setup；action 按 SHA 固定，permissions 默认 contents: read；
  不接 AI PR 审查（claude-code-action 只认官方 key 或 Bedrock / Vertex，第三方中转在 CI 不可用；
  需要时用仓库 Rulesets 的 Copilot code review）；renovate.json 周末运行、不自动合并。

  提交门禁：husky 经 prepare 安装，pre-commit 用 lint-staged 只对暂存文件跑 oxlint --fix 与 oxfmt，
  commit-msg 用 commitlint 校验 conventional 提交信息；全量检查仍由 CI 负责，跳过用 git commit --no-verify。
  质量检查新增 sherif（依赖版本 / 依赖类型 / workspace 一致性）与 knip（死依赖、死引用、死文件、死导出，
  配置在根 knip.jsonc），两者都进 quality workflow；knip:fix / sherif:fix 只在本地人工确认后使用。
  版本管理：Changesets 固定组统一十个 workspace 包版本，配置在 .changeset/config.json；
  功能 PR 带 changeset，合并 main 后 release workflow 用 changesets/action 开/更新 Version Packages PR；
  不发布 npm、不打 tag；根 package.json 由 scripts/sync-version.mjs 同步。

  技术栈（部分已落地）：Electron 45 + Electron Forge 8 + Next.js 16 / React 19 / Tailwind v4 / shadcn 桌面端（3000；生产态静态导出）；
  NestJS 12 的 BFF（4000）与本地服务（5000）；LangGraph.js + LangChain.js + Zod；
  Storybook 10.6（@storybook/react-vite）与 @storybook/addon-mcp（docs + development 工具集）；
  ky + Vitest（已接入，行覆盖率门槛 95%）；Oxlint + Oxfmt（已接入）；chrome-devtools MCP；
  Supabase（Postgres / pgvector / Auth / Storage）+ MikroORM；A2A。

  文档约定：根 README / CLAUDE / AGENTS 是全局索引；每个 workspace 包另有
  README.md / CLAUDE.md / AGENTS.md，包本地事实（命令、端口、边界）以包 README 为准。
  Storybook 的 MCP 端点 http://127.0.0.1:6006/mcp 只在 dev 时可用，暂不含 test-run。

# 按产物类型的规则（可选）
# 为特定产物添加自定义规则。
# 示例：
#   rules:
#     proposal:
#       - 提案控制在 500 字以内
#       - 明确写出不做什么
#     tasks:
#       - 任务拆分到可验收的粒度

# 按操作的指导（可选）
# 为 apply / archive 添加建议性指导，与上面的产物规则分开。
# 示例：
#   operations:
#     apply:
#       guidance:
#         - 测试小结保持简洁
#     archive:
#       guidance:
#         - 归档前先总结结果
