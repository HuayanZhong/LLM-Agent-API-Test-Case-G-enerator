schema: spec-driven

context: |
  语言：zh-CN
  所有 OpenSpec 产物必须用中文撰写；结构化标题与 SHALL/MUST 关键词保留英文。

  项目：基于大模型智能体的接口测试用例辅助生成系统（本科毕设）。
  目标：别人交付已做好的功能 / 组件后，AI 按接口生成用例与测试数据，Agent 执行测试，
  再与正常现场记忆 / GraphRAG / OKF 比对；不一致时重放复现并出测试报告，一致时沉淀知识。
  红线：系统只诊断与复验，不改代码；测试报告是唯一交付物；关键节点由人确认。

  当前状态：pnpm monorepo；apps/frontend 是 Next.js 16 + React 19 + Tailwind v4 骨架
  （3000，src/），packages/ui 提供 shadcn radix-nova 组件、共享样式与 Storybook 10.6（6006）；
  packages/typescript-config 提供 base / nextjs / react-library / nestjs 四个共享 tsconfig profile，
  根 pnpm check-types 经 Turbo 并行执行；packages/vitest-config 提供 base / react 两个 Vitest profile，
  覆盖率 reporter 为 text / lcov / json-summary，根 pnpm test 经 Turbo 并行执行并卡 95% 行覆盖率；
  apps/backend 与 apps/bff 是 NestJS 12 + ESM 骨架，分别监听 BACKEND_PORT（默认 5000）
  与 BFF_PORT（默认 4000），只有 GET /health；
  根 pnpm build 经 Turbo 构建三个 app；业务模块尚未接入；
  lint / format 已接入 Oxlint / Oxfmt（根配置 + 六个包脚本），根配置文件由 format:root 检查。设计文档在 doc/，OpenSpec 规格在 openspec/specs。

  环境变量：根 .env.example 是唯一声明入口，实际值放 .env / .env.development / .env.production；
  dev / test / test:watch 按 .env → .env.development 顺序加载，build 按 .env → .env.production 加载，
  再由 Turbo 启动任务；前端 NEXT_PUBLIC_* 的实际值放 apps/frontend/.env.development / .env.production，
  由 Next 原生加载；变量必须同时写进 turbo.json 对应任务的 env，
  否则 Turbo 默认 strict 模式不会传给任务；.env*、apps/frontend/.env* 与 .nvmrc 在 globalDependencies 中。

  CI：.github/workflows 按 quality / test / build / security / agent-review / labeler 拆分，
  共用 .github/actions/setup；action 按 SHA 固定，permissions 默认 contents: read；
  agent review 跳过 draft 与 fork PR，需要 ANTHROPIC_API_KEY；renovate.json 周末运行、不自动合并。

  技术栈（部分已落地）：Electron（待接入）+ Next.js 16 / React 19 / Tailwind v4 / shadcn 桌面端（3000）；
  NestJS 12 的 BFF（4000）与本地服务（5000）；LangGraph.js + LangChain.js + Zod；
  Storybook 10.6（@storybook/react-vite）与 @storybook/addon-mcp（docs + development 工具集）；
  ky + Vitest（已接入，行覆盖率门槛 95%）；Oxlint + Oxfmt（已接入）；chrome-devtools MCP；
  Supabase（Postgres / pgvector / Auth / Storage）+ MikroORM；A2A。

  文档约定：根 README / CLAUDE / AGENTS 是全局索引；每个 workspace 包另有
  README.md / CLAUDE.md / AGENTS.md，包本地事实（命令、端口、边界）以包 README 为准。
  Storybook 的 MCP 端点 http://127.0.0.1:6006/mcp 只在 dev 时可用，暂不含 test-run。

# 按产物类型的规则（可选）
# 为特定产物添加自定义规则。
# 示例：
#   rules:
#     proposal:
#       - 提案控制在 500 字以内
#       - 明确写出不做什么
#     tasks:
#       - 任务拆分到可验收的粒度

# 按操作的指导（可选）
# 为 apply / archive 添加建议性指导，与上面的产物规则分开。
# 示例：
#   operations:
#     apply:
#       guidance:
#         - 测试小结保持简洁
#     archive:
#       guidance:
#         - 归档前先总结结果
